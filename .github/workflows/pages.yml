name: Publish learning guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0
      - name: Prepare Jekyll source
        run: |
          mkdir -p _site-source/assets
          cp -R site/. _site-source/
          cp docs/diagrams/01-architecture-overview.png _site-source/assets/
          cp docs/diagrams/03-chat-turn-sequence.png _site-source/assets/
          cp docs/diagrams/05-agent-building-blocks.png _site-source/assets/
          cp docs/diagrams/06-agent-mcp-internals.png _site-source/assets/
          cp docs/diagrams/09-observability.png _site-source/assets/
          cp docs/diagrams/10-evaluation-pipeline.png _site-source/assets/
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site-source
          destination: ./_site
      - name: Set artifact name
        id: artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: _site
          name: ${{ steps.artifact-name.outputs.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
