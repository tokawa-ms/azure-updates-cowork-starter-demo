# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Azure Updates Cowork の azd 定義(設計書10.3節 A案)。
# - ルートの Bicep (infra/) が、監視、ACR、Container Apps (Express)、Foundry の参照(または新規作成)を受け持つ。
# - ai-project サービスは、Bicep の出力 FOUNDRY_PROJECT_ENDPOINT のプロジェクトにつなぐ。
# - agent サービスは Hosted Agent。ACR のリモート ビルドでイメージを作る。
name: azure-updates-cowork
metadata:
  template: azure-updates-cowork@0.1.0
requiredVersions:
  azd: ">= 1.37.0"
  extensions:
    azure.ai.agents: ">= 1.0.0"
infra:
  provider: bicep
  path: infra
  module: main
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
  agent:
    host: azure.ai.agent
    kind: hosted
    name: updates-cowork
    project: src/UpdatesCowork.Agent
    language: docker
    uses:
      - ai-project
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    protocols:
      - protocol: responses
        version: 2.0.0
    container:
      resources:
        cpu: "1"
        memory: 2Gi
    policies:
      - type: rai_policy
        raiPolicyName: ${AZURE_AI_RAI_POLICY_ID}
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      ARTIFACTS_MODE: SessionFiles
      CONTENT_SAFETY_ENDPOINT: ${AZURE_AI_ACCOUNT_ENDPOINT}
      PROMPT_SHIELDS_MODE: Annotate
      REQUIRE_APPROVAL_FOR_ARTIFACTS: "false"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
      TZ: Asia/Tokyo
  agent-eval:
    host: azure.ai.agent
    kind: hosted
    name: updates-cowork-eval
    project: src/UpdatesCowork.Agent
    language: docker
    uses:
      - ai-project
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    protocols:
      - protocol: responses
        version: 2.0.0
    container:
      resources:
        cpu: "1"
        memory: 2Gi
    policies:
      - type: rai_policy
        raiPolicyName: ${AZURE_AI_RAI_POLICY_ID}
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_UPDATES_FIXTURES_DIR: /app/eval-fixtures
      ARTIFACTS_MODE: SessionFiles
      CONTENT_SAFETY_ENDPOINT: ${AZURE_AI_ACCOUNT_ENDPOINT}
      PROMPT_SHIELDS_MODE: Annotate
      REQUIRE_APPROVAL_FOR_ARTIFACTS: "false"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "true"
      TZ: Asia/Tokyo
  web:
    host: containerapp
    apiVersion: "2026-07-01"
    project: src/UpdatesCowork.Web
    language: dotnet
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
hooks:
  postdeploy:
    posix:
      shell: sh
      run: ./infra/hooks/postdeploy.sh
      continueOnError: false
    windows:
      shell: pwsh
      run: ./infra/hooks/postdeploy.ps1
      continueOnError: false
