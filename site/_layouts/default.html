<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <script src="{{ '/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="学習ガイドのトップ">
      <span class="brand-mark">A</span>
      <span>AZURE UPDATES COWORK <small>FIELD GUIDE</small></span>
    </a>
    <nav class="site-nav" aria-label="学習ガイド">
      <a href="{{ '/architecture/' | relative_url }}"{% if page.url == '/architecture/' %} aria-current="page"{% endif %}>構成を読む</a>
      <a href="{{ '/implementation/' | relative_url }}"{% if page.url == '/implementation/' %} aria-current="page"{% endif %}>作る</a>
      <a href="{{ '/hosting/' | relative_url }}"{% if page.url == '/hosting/' %} aria-current="page"{% endif %}>動かす</a>
      <a href="{{ '/integration/' | relative_url }}"{% if page.url == '/integration/' %} aria-current="page"{% endif %}>組み込む</a>
      <a href="{{ '/observability/' | relative_url }}"{% if page.url == '/observability/' %} aria-current="page"{% endif %}>見る</a>
      <a href="{{ '/evaluation/' | relative_url }}"{% if page.url == '/evaluation/' %} aria-current="page"{% endif %}>測る</a>
      <a href="{{ '/improvement/' | relative_url }}"{% if page.url == '/improvement/' %} aria-current="page"{% endif %}>直す</a>
      <a href="{{ '/automation/' | relative_url }}"{% if page.url == '/automation/' %} aria-current="page"{% endif %}>回し続ける</a>
      <a href="{{ '/adoption/' | relative_url }}"{% if page.url == '/adoption/' %} aria-current="page"{% endif %}>導入する</a>
    </nav>
  </header>

  <main id="main" class="{{ page.main_class | default: 'lesson' }}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <a class="footer-brand" href="{{ '/' | relative_url }}">AZURE UPDATES COWORK <span>FIELD GUIDE</span></a>
    <p>教材はリポジトリの設計・ソース・評価記録を参照しています。ポータル画面やサービス仕様は更新されるため、実装前に公式資料も確認してください。</p>
    <a href="https://github.com/tokawa-ms/azure-updates-cowork-starter-demo">GitHub リポジトリ <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
